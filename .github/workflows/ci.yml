name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Tests need the checkout folder to be a valid package name (the repo root has __init__.py).
        working-directory: data_clean_env
    steps:
      - uses: actions/checkout@v4
        with:
          path: data_clean_env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data_clean_env/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest ruff==0.17.4
      - name: Lint
        run: ruff check --isolated --select E4,E7,E9,F .
      - name: Test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t data-clean-env .
      - name: Run scripted policy against the container
        run: |
          docker run -d --name env -p 8000:8000 data-clean-env
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          docker run --rm --network host -v "$PWD:/src:ro" -w /src data-clean-env \
            python examples/scripted_policy.py http://localhost:8000 | tee run.txt
          test "$(grep -c 'checks pass' run.txt)" -eq 4
          grep 'checks pass' run.txt | awk '{split($1, n, "/"); if (n[1] != n[2]) exit 1}'
